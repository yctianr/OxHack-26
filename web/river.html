<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spillcast · Oxford rivers</title>
<meta name="description" content="Is the river safe to swim in, and safe for fish? Estimated E. coli and ammonia every 100 m of river around Oxford, from sewage spills, past and forecast.">
<style>
:root{--ink:#1f2a30;--mute:#6b7a80;--line:#e3e8ea;--card:rgba(255,255,255,.96);--accent:#1f6f8b;--good:#2e8b57;--warn:#d98a1b;--bad:#c2362f;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef2f3}
#map{position:absolute;inset:0}
.panel{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(20,40,50,.08)}
.title{left:16px;top:16px;padding:10px 12px 10px 14px;width:290px}
.title h1{font-size:15px;font-weight:650;margin:0}.title p{font-size:12px;color:var(--mute);margin:2px 0 0}
.toggles{right:16px;top:16px;padding:6px;display:flex;gap:6px}
.tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:500 13px inherit;font-family:inherit;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px}
.tg i{width:10px;height:10px;border-radius:50%;background:#cfd8dc}
.tg[aria-pressed=true]{color:var(--ink);border-color:#c9d3d6}
.tg[aria-pressed=true].ec i{background:linear-gradient(90deg,#3aa76d,#f2b134,#e4572e)}
.tg[aria-pressed=true].am i{background:linear-gradient(90deg,#3aa76d,#9b7ad0,#5b2a86)}
.time{left:50%;transform:translateX(-50%);bottom:18px;width:min(760px,calc(100% - 32px));padding:12px 16px 10px}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.trow>div:first-child{flex:none;white-space:nowrap}
.date{font-size:16px;font-weight:650;display:inline-block;min-width:150px;text-align:center}
.step{border:0;background:none;font-size:20px;line-height:1;color:var(--mute);cursor:pointer;padding:0 6px;vertical-align:-1px}.step:hover{color:var(--ink)}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:2px}
.tag.past{background:#eef2f3;color:var(--mute)}.tag.fc{background:#e3f1f6;color:var(--accent)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mute);flex-wrap:wrap;justify-content:flex-end}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #cfd8dc}
.legend .line{display:inline-block;width:18px;height:3px;border-radius:2px;background:#8fbfd6;vertical-align:2px;margin-right:5px}
.legend .ramp{display:inline-block;width:64px;height:6px;border-radius:3px;vertical-align:1px;margin:0 5px}
#day{width:100%;margin:10px 0 2px;accent-color:var(--accent);cursor:pointer}
.ticks{position:relative;height:14px;font-size:10.5px;color:var(--mute)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span.l{transform:none}.ticks span.r{transform:translateX(-100%)}
.ticks span.today{color:var(--accent);font-weight:600}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(20,40,50,.14);padding:10px 12px;font-size:12.5px;min-width:220px;display:none;z-index:5}
.tip h3{font-size:13px;margin:0 0 6px;font-weight:650}
.tip .row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-top:5px}
.tip .v{font-variant-numeric:tabular-nums;font-weight:600}
.tip .chip{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.good{background:#e6f4ec;color:var(--good)}.chip.warn{background:#fbf0de;color:#a86509}.chip.bad{background:#fbe6e4;color:var(--bad)}
.tip .note{color:var(--mute);font-size:11px;margin-top:7px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px;pointer-events:none}
.attrib{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--mute);background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px}
.attrib a{color:inherit}
[hidden]{display:none!important}
.side{left:16px;top:136px;width:290px;max-height:calc(100% - 152px);display:flex;flex-direction:column;padding:12px 0 6px}
.side .head{padding:0 14px 8px;border-bottom:1px solid var(--line)}
.side .count{font-size:14px;font-weight:650}.side .count b{color:var(--bad)}
.side .sub{font-size:11.5px;color:var(--mute);margin-top:2px}
.side ol{list-style:none;margin:0;padding:4px 0;overflow-y:auto}
.side li{padding:6px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px}
.side li:hover{background:#f3f6f7}
.side li .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side li .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.side li .bar{grid-column:1/-1;height:4px;border-radius:2px;background:#f1d6d4;overflow:hidden}
.side li .bar i{display:block;height:100%;background:var(--bad);border-radius:2px}
.side li .h{grid-column:1/-1;font-size:11px;color:var(--mute)}
.side .none{padding:14px;font-size:12.5px;color:var(--mute)}
.avoid{left:auto;right:16px;top:72px}
.avoid li{grid-template-columns:1fr auto}
.avoid li .why{grid-column:1/-1;font-size:11.5px}
.avoid li .week{grid-column:1/-1;display:flex;gap:3px;margin:2px 0}
.avoid li .week .d{font-style:normal;width:22px;height:16px;border-radius:3px;background:#e6f4ec;color:#2e8b57;font-size:9.5px;font-weight:600;display:grid;place-items:center}
.avoid li .week .d.sw{background:var(--bad);color:#fff}.avoid li .week .d.fi{background:#8e63c9;color:#fff}
.avoid li .why .sw{color:var(--bad);font-weight:600}.avoid li .why .fi{color:#6b3fa0;font-weight:600}
.avoid .count b{color:var(--bad)}
.tg.av[aria-pressed=true]{background:#fbe6e4;border-color:#f0c4c0;color:var(--bad)}
.tg.av i{background:var(--bad)}
.modes{display:flex;gap:4px;margin-top:8px;background:#eef2f3;border-radius:8px;padding:3px}
.modes button{flex:1;border:0;background:none;border-radius:6px;padding:5px 10px;font:500 12.5px inherit;font-family:inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
.modes button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,40,50,.12)}
.rainrow{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px}
.rainrow input{flex:1;accent-color:#3a7bd5}
.rainrow b{font-variant-numeric:tabular-nums;min-width:118px;text-align:right}
.link{border:0;background:none;color:var(--accent);font:500 12px inherit;font-family:inherit;cursor:pointer;padding:0;white-space:nowrap}
.link:disabled{color:var(--mute);cursor:default}
.card{right:16px;top:72px;width:300px;padding:14px 16px;font-size:12.5px}
.card h2{font-size:14px;margin:0 22px 2px 0;font-weight:650}.card .sub{color:var(--mute);font-size:11.5px}
.card .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:18px;color:var(--mute);cursor:pointer}
.card label{display:flex;justify-content:space-between;margin-top:12px;font-weight:600}.card label span{font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.card input[type=range]{width:100%;accent-color:#3a7bd5;margin:4px 0 0}
.card table{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
.card td,.card th{padding:4px 0;border-bottom:1px solid var(--line);text-align:right;font-weight:500}
.card th{color:var(--mute);font-size:11px}.card td:first-child,.card th:first-child{text-align:left;color:var(--mute)}
.card td.better{color:var(--good);font-weight:650}.card td.worse{color:var(--bad);font-weight:650}
.card .foot{display:flex;justify-content:space-between;margin-top:10px}
@media(max-width:640px){.title p{display:none}.toggles{top:auto;bottom:128px;right:16px}.legend{display:none}}
</style></head>
<body>
<div id="map" aria-label="Map of rivers around Oxford"></div>
<div class="loading" id="loading">Loading…</div>
<div class="panel title"><h1>Oxford rivers</h1><p id="hint">Safe to swim? Safe for fish? Hover over a river.</p>
  <div class="modes" role="group" aria-label="Mode"><button id="m-real" aria-pressed="true">Forecast &amp; past</button><button id="m-scn" aria-pressed="false">My scenario</button></div></div>
<div class="panel side" id="side" aria-label="Works spilling on this day"><div class="head"><div class="count" id="scount"></div><div class="sub" id="ssub"></div></div><ol id="slist"></ol></div>
<div class="panel toggles" role="group" aria-label="Heatmaps">
  <button class="tg ec" id="tg-e" aria-pressed="true"><i></i>E. coli</button>
  <button class="tg am" id="tg-a" aria-pressed="false"><i></i>Ammonia</button>
  <button class="tg av" id="tg-v" aria-pressed="false"><i></i>Rivers to avoid</button>
</div>
<div class="panel side avoid" id="avoid" hidden aria-label="Rivers to avoid on this day"><div class="head"><div class="count" id="acount"></div><div class="sub" id="asub"></div></div><ol id="alist"></ol></div>
<div class="panel time">
  <div class="trow"><div><button class="step" id="prev" aria-label="Previous day">‹</button><span class="date" id="date">–</span><button class="step" id="next" aria-label="Next day">›</button><span class="tag" id="tag"></span></div>
    <div class="legend" id="legend"></div></div>
  <input id="day" type="range" min="0" max="0" value="0" aria-label="Day">
  <div class="ticks" id="ticks"></div>
  <div class="rainrow" id="rainrow" hidden><span>Rainfall</span><input id="rain" type="range" min="0" max="80" step="0.5" value="0" aria-label="Rainfall that day, everywhere, mm">
    <b id="rainlab">as it fell</b><button class="link" id="rainreset">As it fell</button><button class="link" id="resetall">Reset all</button></div>
</div>
<div class="panel card" id="card" hidden>
  <button class="x" id="cardx" aria-label="Close">×</button>
  <h2 id="cname"></h2><div class="sub" id="csub"></div>
  <label>Storm tank <span id="vlab"></span></label><input id="vin" type="range" min="0" max="1" step="1" aria-label="Storm tank volume">
  <label>Treatment capacity <span id="clab"></span></label><input id="cin" type="range" min="0.5" max="3" step="0.05" value="1" aria-label="Treatment capacity, times today's">
  <table id="ctab"></table>
  <div class="foot"><span class="sub" id="cnote"></span><button class="link" id="creset">Reset this works</button></div>
</div>
<div class="tip" id="tip"></div>
<div class="attrib">Estimates from a physics model of each works, not measurements · Basemap © Esri, HERE, Garmin, © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Rivers: OS Open Rivers, © Crown copyright</div>

<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
<script>
(async function(){
'use strict';
const [Q,PH]=await Promise.all(['data/quality.json','data/physics.json'].map(u=>fetch(u).then(r=>r.json())));
const P=Q.params, N=Q.seg.xy.length, D=Q.dates, NOBS=Q.nobs, $=id=>document.getElementById(id);
const MAIN=new Set(['River Thames','River Cherwell','River Evenlode','River Windrush','River Thame','River Ock','River Ray','River Glyme']);
let day=Math.min(NOBS,D.length-1), showE=true, showA=false;   // opens on today (the first forecast day)
let scenario=false, rainSet=null, picked=-1;                   // scenario mode: rain everywhere (mm, null = as it fell), works on the card
const EDIT={};                                                  // works index -> {V: m3, Cx: capacity multiplier}; kept across days
let SC=[];                                                      // scenario result per works for the day: {p, h, v}

// ---- the physics water balance, one day of one works, rerun in the browser (as scripts/web/physics.py) ----
const PW=Q.works.map(w=>PH.works[w.id]||null), DRV=PH.drivers;
Q.works.forEach((w,i)=>w.i=i);
const WS=Q.works.filter(w=>w.seg);   // shown on the map: works with flow data (the physics model covers them)
const ASSESSED=new Set(WS.flatMap(w=>w.seg));   // river within 40 km downstream of a works; the rest is not assessed
// a name for every assessed stretch: its river's name, or "Stream below <nearest works upstream>" for unnamed streams
const OWNER=new Map();
for(const w of WS) w.seg.forEach((j,k)=>{ const o=OWNER.get(j); if(!o||w.t[k]<o.t) OWNER.set(j,{w,t:w.t[k]}); });
const segName=j=>Q.names[Q.seg.name[j]]||`Stream below ${OWNER.get(j).w.name}`;
let showV=false;
function rng(seed){ return ()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rainDay(pw,d){ const [a,b,w1]=pw.g; return DRV.rain[a][d].map((x,h)=>w1*x+(1-w1)*DRV.rain[b][d][h]); }
function physDay(pw,d,R,V,C){ // 200 runs with a daily inflow error; storm tank V (m3), capacity C (m3/h); R = rain that day (mm) or null
  const m=pw.prm, act=rainDay(pw,d), tot=act.reduce((a,x)=>a+x,0), rain=R==null?act:act.map(x=>tot>0.05?x*R/tot:R/24);
  const af=Math.exp(-1/m.tf), ag=m.mode===0?Math.exp(-1/(m.p1*24)):0, rnd=rng(1), n=200;
  let sp=0,hrs=0,vol=0;
  for(let j=0;j<n;j++){
    const e=Math.sqrt(-2*Math.log(rnd()||1e-12))*Math.cos(2*Math.PI*rnd())*m.sig, mult=Math.exp(e-m.sig*m.sig/2);
    let [Dd,G,r,tank]=pw.s[d], on=false; tank=Math.min(tank,V);
    for(let t=0;t<rain.length;t++){
      r=af*r+(1-af)*rain[t];
      Dd+=DRV.pet[d][t]*(1-Dd/m.p2)-rain[t]; let rech=0; if(Dd<0){rech=-Dd;Dd=0;} else if(Dd>m.p2) Dd=m.p2;
      let inf; if(m.mode===0){G=ag*G+rech; inf=m.k*G;} else inf=m.k*Math.max(0,DRV.wet[d][t]-m.p1);
      const q=(m.F*(1+0.3*Math.cos(2*Math.PI*(DRV.lh[d][t]-12)/24))+inf+10*(m.A+m.As*(1-Dd/m.p2))*r)*mult;
      if(q>C){ const ex=q-C; if(ex<=V-tank) tank+=ex; else { const x=ex-(V-tank); tank=V; if(x>1e-6){on=true;hrs++;vol+=x;} } }
      else tank-=Math.min(tank,C-q);
    }
    sp+=on; }
  return {p:sp/n,h:hrs/n,v:vol/n}; }
const baseV=i=>PW[i].prm.V, baseC=i=>PW[i].prm.C;
const runWorks=(i,edited=true)=>{ const e=edited&&EDIT[i]||{}; return physDay(PW[i],day,rainSet,e.V??baseV(i),baseC(i)*(e.Cx??1)); };
function scenarioAll(){ SC=Q.works.map((w,i)=>PW[i]?runWorks(i):null); }
// spill state and rate used for the river: real mode = monitors (past) / forecast; scenario = the rerun model
const spills=(i,d=day,real=false)=>scenario&&!real?!!(SC[i]&&SC[i].p>=0.5):!!(Q.works[i].seg&&Q.works[i].spill[d]);
const rateOf=(i,real=false)=>scenario&&!real&&SC[i]&&SC[i].h>0?SC[i].v/SC[i].h/3600:Q.works[i].rate;
// spill volume (m3) and hours for the sidebar: scenario run; monitor hours x modelled rate on past days; physics forecast otherwise
function spillSize(i){ const w=Q.works[i];
  if(scenario) return SC[i]?{v:SC[i].v,h:SC[i].h,est:'scenario'}:null;
  if(day<NOBS&&!w.src[day]&&w.hours[day]>0) return {v:w.hours[day]*w.rate*3600,h:w.hours[day],est:'monitor'};
  return {v:w.vol[day],h:w.hours[day],est:'model'}; }

// ---- concentrations for one day: background + every spilling works upstream, diluted and decaying with travel time ----
const E=new Float64Array(N), A=new Float64Array(N), FLOW=new Float64Array(N);
function compute(d,real=false){   // real: monitors / forecast even in scenario mode
  for(let j=0;j<N;j++){ const r=Q.seg.ref[j]; FLOW[j]=Math.max(r>=0?Q.flow[r][d]:Q.qspec[d]*Q.seg.area[j],P.min_flow); }
  E.fill(P.ecoli_bg); A.fill(P.ammonia_bg);
  const mo=+D[d].slice(5,7), ke=mo>=4&&mo<=9?P.ecoli_k_summer:P.ecoli_k_winter;   // E. coli dies off faster in summer light
  Q.works.forEach((w,wi)=>{ if(!w.seg||!spills(wi,d,real)) return; const rate=rateOf(wi,real);
    for(let i=0;i<w.seg.length;i++){ const j=w.seg[i], t=w.t[i]/24, f=rate/(FLOW[j]+rate);
      E[j]+=P.ecoli_source*f*Math.exp(-ke*t); A[j]+=P.ammonia_source*f*Math.exp(-P.ammonia_k*t); } });
}
const verdictE=v=>v<P.swim_ok?['good','Safe for swimmers']:v<P.swim_bad?['warn','Take care if swimming']:['bad','Not safe to swim'];
const verdictA=v=>v<P.fish_ok?['good','Safe for fish']:v<P.fish_bad?['warn','Stressful for sensitive fish']:['bad','Harmful to fish'];
const fmtE=v=>v>=1e5?(v/1e3).toFixed(0)+',000':Math.round(v).toLocaleString('en-GB');
const fmtA=v=>v<1?v.toFixed(2):v<10?v.toFixed(1):Math.round(v).toString();

// ---- map (deck.gl: light basemap tiles, rivers, heatmaps, discharge points) ----
const {Deck,MapView,TileLayer,BitmapLayer,PathLayer,ScatterplotLayer,PathStyleExtension}=deck;
const tiles=(id,svc)=>new TileLayer({id,data:`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${svc}/MapServer/tile/{z}/{y}/{x}`,
  minZoom:0,maxZoom:16,tileSize:256,renderSubLayers:p=>{const {west,south,east,north}=p.tile.bbox;
    return new BitmapLayer(p,{data:null,image:p.data,bounds:[west,south,east,north]});}});
const SEG=Q.seg.xy.map((c,j)=>({j,path:[[c[0],c[1]],[c[2],c[3]]],m:MAIN.has(Q.names[Q.seg.name[j]])}));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function ramp(stops,v){ // stops: [[value, '#hex'],...] on log10(value)
  const x=Math.log10(Math.max(v,1e-6));
  for(let i=1;i<stops.length;i++){ const [v0,c0]=stops[i-1],[v1,c1]=stops[i], a=Math.log10(v0), b=Math.log10(v1);
    if(x<=b){ const t=Math.max(0,(x-a)/(b-a)), A=hex(c0), B=hex(c1); return A.map((u,k)=>Math.round(u+(B[k]-u)*t)); } }
  return hex(stops.at(-1)[1]); }
// green where safe; E. coli turns amber then red above the swimming limits, ammonia purple above the fish limits
const ES=[[P.swim_bad*0.99,'#3aa76d'],[P.swim_bad,'#f2b134'],[1e4,'#e4572e'],[3e5,'#8e1b3a']];
const AS=[[P.fish_bad*0.99,'#3aa76d'],[P.fish_bad,'#9b7ad0'],[3,'#5b2a86'],[10,'#2d0f4a']];
let SEGS=SEG.filter(d=>ASSESSED.has(d.j)), version=0, hover=null;
function layers(){
  const v=version;
  return [
    tiles('base','World_Light_Gray_Base'),
    new PathLayer({id:'river',data:SEG,getPath:d=>d.path,getColor:[143,191,214],widthUnits:'pixels',getWidth:d=>d.m?2.2:1,capRounded:true}),
    // assessed river is coloured: green where safe; the polluted stretches drawn on top so they stand out. The rest stays pale blue
    new PathLayer({id:'ecoli',data:SEGS,visible:showE,getPath:d=>d.path,getColor:d=>[...ramp(ES,E[d.j]),235],
      widthUnits:'pixels',getWidth:d=>(d.m?3.5:1.8)*(showA?1.6:1),capRounded:true,updateTriggers:{getColor:v,getWidth:showA}}),
    new PathLayer({id:'ammonia',data:SEGS,visible:showA,getPath:d=>d.path,getColor:d=>[...ramp(AS,A[d.j]),235],
      widthUnits:'pixels',getWidth:d=>(d.m?3.5:1.8)*(showE?0.55:1),capRounded:true,updateTriggers:{getColor:v,getWidth:showE}}),
    new PathLayer({id:'hit',data:SEG,getPath:d=>d.path,getColor:[0,0,0,1],widthUnits:'pixels',getWidth:14,pickable:true}),
    tiles('labels','World_Light_Gray_Reference'),
    // dotted connector from each discharge point to where it enters its river
    new PathLayer({id:'links',data:WS,getPath:w=>[[w.lon,w.lat],w.entry],getColor:[38,50,56,190],widthUnits:'pixels',getWidth:1.6,
      getDashArray:[2,2],dashJustified:true,extensions:[new PathStyleExtension({dash:true})]}),
    // halo on works spilling that day
    new ScatterplotLayer({id:'halo',data:WS.filter(w=>spills(w.i)),getPosition:w=>[w.lon,w.lat],radiusUnits:'pixels',getRadius:13,
      getFillColor:[194,54,47,55],updateTriggers:{getPosition:v}}),
    // edited works (scenario): a blue ring; the works on the card: a larger one
    new ScatterplotLayer({id:'edited',data:scenario?WS.filter(w=>EDIT[w.i]||w.i===picked):[],getPosition:w=>[w.lon,w.lat],radiusUnits:'pixels',
      getRadius:w=>w.i===picked?14:11,stroked:true,filled:false,lineWidthUnits:'pixels',getLineWidth:2.5,getLineColor:[58,123,213],updateTriggers:{getRadius:v}}),
    new ScatterplotLayer({id:'pts',data:WS,getPosition:w=>[w.lon,w.lat],radiusUnits:'pixels',getRadius:w=>spills(w.i)?7.5:6.5,
      stroked:true,lineWidthUnits:'pixels',getLineWidth:2,getLineColor:[255,255,255],
      getFillColor:w=>spills(w.i)?[194,54,47]:[38,50,56],
      pickable:true,updateTriggers:{getFillColor:v,getRadius:v}})];
}
const D3=new Deck({parent:$('map'),views:new MapView({repeat:false}),initialViewState:{longitude:-1.31,latitude:51.73,zoom:10.3,maxZoom:16,minZoom:8},
  controller:{dragRotate:false,touchRotate:false},layers:[],onHover:onHover,onClick:onClick,getCursor:({isHovering})=>isHovering?'crosshair':'grab'});

function render(){
  if(scenario) scenarioAll();
  compute(day);
  const now=new Set();
  Q.works.forEach((w,i)=>{ if(w.seg&&spills(i)) for(const j of w.seg) now.add(j); });
  SEGS=[...SEG.filter(d=>ASSESSED.has(d.j)&&!now.has(d.j)),...[...now].map(j=>SEG[j])]; version++;   // only assessed river; polluted stretches last = on top
  D3.setProps({layers:layers()});
  const fc=day>=NOBS;
  $('date').textContent=new Date(D[day]+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('tag').className='tag '+(fc||scenario?'fc':'past'); $('tag').textContent=scenario?'My scenario':fc?(day===NOBS?'Today · forecast':'Forecast'):'Past';
  if(scenario) paintRain(); if(picked>=0) paintCard();
  paintSide(); paintAvoid();
  $('legend').innerHTML=`<span><i class="dot" style="background:#c2362f"></i>spilling <i class="dot" style="background:#263238;margin-left:6px"></i>not spilling</span>`+(showE||showA?`<span><i class="line"></i>not assessed</span>`:'')+(showE?`<span>E. coli<span class="ramp" style="background:linear-gradient(90deg,#3aa76d 0 30%,#f2b134 45%,#e4572e 70%,#8e1b3a)"></span>unsafe from ${P.swim_bad.toLocaleString('en-GB')}/100 mL</span>`:'')+
    (showA?`<span>Ammonia<span class="ramp" style="background:linear-gradient(90deg,#3aa76d 0 30%,#9b7ad0 45%,#5b2a86 75%,#2d0f4a)"></span>harmful from ${P.fish_bad} mg/L</span>`:'');
  if(hover) onHover(hover);
}

// ---- hover ----
const tip=$('tip');
function onHover(info){
  hover=info.object!=null?info:null;
  if(!hover){ tip.style.display='none'; return; }
  if(info.layer.id==='pts'){
    const w=info.object, fc=day>=NOBS; let s;
    const i=w.i;
    if(scenario&&SC[i]) s=`Scenario: ${Math.round(SC[i].p*100)}% chance of a spill · ${Math.round(SC[i].h*10)/10} h · ${Math.round(SC[i].v).toLocaleString('en-GB')} m³<br><span class="note">Click to change its storm tank or capacity</span>`;
    else if(fc) s=`${Math.round(w.p[day]*100)}% chance of a spill${w.spill[day]?` · about ${Math.round(w.vol[day]).toLocaleString('en-GB')} m³`:''}`;
    else s=w.spill[day]?`Spilled${w.hours[day]?` for ${w.hours[day]} h`:''}${w.src[day]?' (model; no monitor record)':''}`:(w.src[day]?'No spill (model)':'No spill');
    tip.innerHTML=`<h3>${w.name}</h3><div>${s}</div><div class="note">Discharges into ${w.water||'a river'}</div>`;
  } else {
    const j=info.object.j, nm=Q.names[Q.seg.name[j]]||'Unnamed stream', [ce,te]=verdictE(E[j]), [ca,ta]=verdictA(A[j]);
    if(!ASSESSED.has(j)) tip.innerHTML=`<h3>${nm}</h3><div>Not assessed</div><div class="note">No sewage works upstream within 40 km, so the model has nothing to estimate here. Farm runoff and other sources aren't modelled.</div>`;
    else tip.innerHTML=`<h3>${nm}</h3>
      <div class="row"><span>E. coli</span><span class="v">${fmtE(E[j])} <small>per 100 mL</small></span></div><span class="chip ${ce}">${te}</span>
      <div class="row"><span>Ammonia</span><span class="v">${fmtA(A[j])} <small>mg/L</small></span></div><span class="chip ${ca}">${ta}</span>
      <div class="note">${scenario?'Your scenario':day>=NOBS?'Forecast':'Estimate'} while any sewage spill upstream passes · river flow ${FLOW[j]<1?FLOW[j].toFixed(2):FLOW[j].toFixed(1)} m³/s</div>`;
  }
  tip.style.display='block';
  const pad=14, r=tip.getBoundingClientRect(); let x=info.x+pad, y=info.y+pad;
  if(x+r.width>innerWidth-8) x=info.x-r.width-pad; if(y+r.height>innerHeight-8) y=info.y-r.height-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
render(); $('loading').hidden=true;

// ---- sidebar: works spilling on this day, largest volume first ----
const flyTo=w=>D3.setProps({initialViewState:{longitude:w.lon,latitude:w.lat-0.01,zoom:12.3,maxZoom:16,minZoom:8,transitionDuration:900,transitionInterpolator:new deck.FlyToInterpolator()}});
function paintSide(){
  const rows=WS.filter(w=>spills(w.i)).map(w=>({w,...spillSize(w.i)})).sort((a,b)=>b.v-a.v);
  const tot=rows.reduce((a,r)=>a+r.v,0), mx=rows.length?rows[0].v:1, r1=x=>x<1000?Math.round(x/10)*10:Math.round(x/100)*100;
  $('scount').innerHTML=`<b>${rows.length}</b> of ${WS.length} works spilling`;
  $('ssub').textContent=rows.length?`about ${r1(tot).toLocaleString('en-GB')} m³ of sewage that day · ${scenario?'your scenario':day>=NOBS?'forecast':'monitors, volumes estimated'}`:(scenario?'in your scenario':day>=NOBS?'forecast':'recorded by monitors');
  $('slist').innerHTML=rows.length?rows.map(r=>`<li data-i="${r.w.i}"><span class="n">${r.w.name}</span><span class="v">${r.v<10?'under 10':r1(r.v).toLocaleString('en-GB')} m³</span>
    <span class="bar"><i style="width:${Math.max(2,r.v/mx*100).toFixed(1)}%"></i></span><span class="h">${r.h?(Math.round(r.h*10)/10)+' h':''}${r.est==='model'&&day<NOBS?' · model, no monitor record':''}${scenario||day>=NOBS?` · ${Math.round((scenario?SC[r.w.i].p:r.w.p[day])*100)}% chance`:''}</span></li>`).join('')
    :`<div class="none">No works spilling. Rivers are at background levels.</div>`;
  $('slist').querySelectorAll('li').forEach(li=>li.onclick=()=>{ const w=Q.works[+li.dataset.i]; flyTo(w);
    if(scenario) onClick({object:w,layer:{id:'pts'}}); });
}

// ---- right sidebar: rivers to avoid over the 7 forecast days (the official forecast; computed once) ----
const FDAYS=[...Array(D.length-NOBS).keys()].map(k=>NOBS+k);
let WEEK=null;
function weekSummary(){
  const G=new Map();
  for(const d of FDAYS){
    compute(d,true);
    const spillers=WS.filter(w=>spills(w.i,d,true));
    for(const j of ASSESSED){ const bs=E[j]>=P.swim_bad, bf=A[j]>=P.fish_bad; if(!bs&&!bf) continue;
      const k=segName(j); let g=G.get(k); if(!g) G.set(k,g={name:k,days:FDAYS.map(()=>0),km:0,peak:0,peakA:0,segs:new Set(),from:new Set(),kmd:{}});
      const di=d-NOBS; g.days[di]=Math.max(g.days[di],bs?2:1); g.kmd[d]=(g.kmd[d]||0)+bs; g.peak=Math.max(g.peak,E[j]); g.peakA=Math.max(g.peakA,A[j]); g.segs.add(j); }
    for(const w of spillers) for(const j of w.seg){ if(E[j]<P.swim_bad&&A[j]<P.fish_bad) continue; const g=G.get(segName(j)); if(g) g.from.add(w.name); }
  }
  for(const g of G.values()) g.km=Math.max(0,...Object.values(g.kmd))/10;
  compute(day);   // restore the map's day
  return [...G.values()].sort((a,b)=>b.days.filter(x=>x===2).length-a.days.filter(x=>x===2).length||b.km-a.km);
}
const wd=d=>new Date(D[d]+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short'});
function spans(days){ // "Sun–Tue, Thu" from the swim-unsafe days
  const out=[]; let i=0;
  while(i<days.length){ if(days[i]!==2){i++;continue;} let j=i; while(j+1<days.length&&days[j+1]===2) j++;
    out.push(i===j?wd(FDAYS[i]):`${wd(FDAYS[i])}–${wd(FDAYS[j])}`); i=j+1; }
  return out.join(', '); }
function paintAvoid(){
  $('avoid').hidden=!showV||picked>=0;
  if(!showV) return;
  if(!FDAYS.length){ $('acount').textContent='No forecast loaded'; $('asub').textContent=''; $('alist').innerHTML=''; return; }
  if(!WEEK) WEEK=weekSummary();
  const rows=WEEK, first=fmtD(D[FDAYS[0]]), last=fmtD(D[FDAYS.at(-1)]);
  $('acount').innerHTML=rows.length?`<b>${rows.length}</b> river${rows.length>1?'s':''} to avoid this week`:'No rivers to avoid this week';
  $('asub').textContent=`${first} – ${last} · physics forecast${Q.issued?', issued '+Q.issued:''}${scenario?' (your scenario changes aren\'t included)':''}`;
  const box=(x,k)=>`<i class="d ${x===2?'sw':x===1?'fi':''}" title="${wd(FDAYS[k])}: ${x===2?'not safe to swim':x===1?'harmful to fish':'safe'}">${wd(FDAYS[k])[0]}</i>`;
  $('alist').innerHTML=rows.map((r,k)=>{ const sw=spans(r.days);
    return `<li data-k="${k}"><span class="n">${r.name}</span><span class="v">${r.km?r.km.toFixed(r.km<1?1:0)+' km':''}</span>
    <span class="week">${r.days.map(box).join('')}</span>
    <span class="why">${sw?`<span class="sw">Avoid ${sw}</span> · up to ${fmtE(r.peak)} E. coli`:''}${r.peakA>=P.fish_bad?`${sw?'<br>':''}<span class="fi">Harmful to fish</span> · up to ${fmtA(r.peakA)} mg/L`:''}</span>
    <span class="h">${r.from.size?'From '+[...r.from].slice(0,3).join(', ')+(r.from.size>3?` and ${r.from.size-3} more`:''):''}</span></li>`; }).join('');
  $('alist').querySelectorAll('li').forEach(li=>li.onclick=()=>{ const r=rows[+li.dataset.k], xy=[...r.segs].map(j=>Q.seg.xy[j]);
    const lon=xy.reduce((a,c)=>a+c[0],0)/xy.length, lat=xy.reduce((a,c)=>a+c[1],0)/xy.length;
    const fd=r.days.findIndex(x=>x>0); if(fd>=0) go(FDAYS[fd]); flyTo({lon,lat:lat+0.01}); });
}
const fmtD=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

// ---- scenario: mode, rainfall, the works card ----
function setMode(s_){ scenario=s_; $('m-real').setAttribute('aria-pressed',String(!s_)); $('m-scn').setAttribute('aria-pressed',String(s_));
  $('rainrow').hidden=!s_; $('hint').textContent=s_?'Click a discharge point to change its storm tank or capacity.':'Safe to swim? Safe for fish? Hover over a river.';
  if(!s_){ picked=-1; $('card').hidden=true; } render(); }
$('m-real').onclick=()=>setMode(false); $('m-scn').onclick=()=>setMode(true);
function meanRain(){ const r=Q.works.map((w,i)=>PW[i]?rainDay(PW[i],day).reduce((a,x)=>a+x,0):null).filter(x=>x!=null); return r.reduce((a,x)=>a+x,0)/r.length; }
function paintRain(){ const asFell=rainSet==null, m=meanRain();
  $('rain').value=String(asFell?Math.round(m*2)/2:rainSet);
  $('rainlab').textContent=asFell?`as it fell (avg ${m.toFixed(1)} mm)`:`${rainSet.toFixed(1)} mm everywhere`;
  $('rainreset').disabled=asFell; $('resetall').disabled=asFell&&!Object.keys(EDIT).length; }
$('rain').oninput=e=>{ rainSet=+e.target.value; render(); };
$('rainreset').onclick=()=>{ rainSet=null; render(); };
$('resetall').onclick=()=>{ rainSet=null; for(const k in EDIT) delete EDIT[k]; render(); };
function onClick(info){
  if(!scenario||!info.object||info.layer.id!=='pts') return;
  const i=info.object.i; if(!PW[i]) return;
  picked=i; $('card').hidden=false;
  const V0=baseV(i); $('vin').max=String(Math.max(5*V0,V0+5000)); $('vin').step=String(Math.max(1,Math.round(V0/100)));
  render(); }
function paintCard(){
  const i=picked, w=Q.works[i], e=EDIT[i]||{}, V=e.V??baseV(i), Cx=e.Cx??1;
  $('cname').textContent=w.name; $('csub').textContent=`${new Date(D[day]+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · ${rainSet==null?'rain as it fell':rainSet.toFixed(1)+' mm of rain'}`;
  $('vin').value=String(V); $('cin').value=String(Cx);
  $('vlab').textContent=`${Math.round(V).toLocaleString('en-GB')} m³${V!==baseV(i)?` (now ${Math.round(baseV(i)).toLocaleString('en-GB')})`:''}`;
  $('clab').textContent=`${Math.round(baseC(i)*24*Cx).toLocaleString('en-GB')} m³/day${Cx!==1?` (now ${Math.round(baseC(i)*24).toLocaleString('en-GB')})`:''}`;
  const b=runWorks(i,false), a=SC[i]||runWorks(i);
  const cell=(x,y,f)=>`<td>${f(x)}</td><td class="${y<x-1e-9?'better':y>x+1e-9?'worse':''}">${f(y)}</td>`;
  $('ctab').innerHTML=`<tr><th>That day</th><th>As built</th><th>Your change</th></tr>`+
    `<tr><td>Chance of a spill</td>${cell(b.p,a.p,x=>Math.round(x*100)+'%')}</tr>`+
    `<tr><td>Spill-hours</td>${cell(b.h,a.h,x=>(Math.round(x*10)/10)+' h')}</tr>`+
    `<tr><td>Spill volume</td>${cell(b.v,a.v,x=>Math.round(x).toLocaleString('en-GB')+' m³')}</tr>`;
  $('cnote').textContent=PH.works[w.id].tank_src;
  $('creset').disabled=!EDIT[i]; }
const edit=(k,val)=>{ EDIT[picked]={...(EDIT[picked]||{}),[k]:val}; const e=EDIT[picked];
  if((e.V??baseV(picked))===baseV(picked)&&(e.Cx??1)===1) delete EDIT[picked]; render(); };
$('vin').oninput=e=>edit('V',+e.target.value);
$('cin').oninput=e=>edit('Cx',+e.target.value);
$('creset').onclick=()=>{ delete EDIT[picked]; render(); };
$('cardx').onclick=()=>{ picked=-1; $('card').hidden=true; render(); };

// ---- controls ----
const sl=$('day'); sl.max=D.length-1; sl.value=day;
sl.style.background='none';
sl.oninput=()=>{ day=+sl.value; render(); };
const go=d=>{ day=Math.max(0,Math.min(D.length-1,d)); sl.value=day; render(); };
$('prev').onclick=()=>go(day-1); $('next').onclick=()=>go(day+1);
const tg=(id,get,set)=>{ $(id).onclick=()=>{ set(!get()); $(id).setAttribute('aria-pressed',String(get())); render(); }; };
tg('tg-e',()=>showE,v=>showE=v); tg('tg-a',()=>showA,v=>showA=v); tg('tg-v',()=>showV,v=>showV=v);
const pct=i=>(i/(D.length-1)*100).toFixed(2)+'%', mon=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{month:'short'});
let ticks=`<span class="l" style="left:0">${mon(D[0])} ${D[0].slice(0,4)}</span>`;
D.forEach((d,i)=>{ if(i>0&&d.slice(8)==='01'&&['01','04','07'].includes(d.slice(5,7))) ticks+=`<span style="left:${pct(i)}">${mon(d)}</span>`; });
if(NOBS<D.length) ticks+=`<span class="today r" style="left:100%">Today → ${D.length-NOBS} forecast days</span>`;
$('ticks').innerHTML=ticks;
})().catch(e=>{ document.getElementById('loading').textContent='Could not load: '+e.message; console.error(e); });
</script>
</body></html>
