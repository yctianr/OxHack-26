<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spillcast · Oxford rivers</title>
<meta name="description" content="Is the river safe to swim in, and safe for fish? Estimated E. coli and ammonia every 100 m of river around Oxford, from sewage spills, past and forecast.">
<style>
:root{--ink:#1f2a30;--mute:#6b7a80;--line:#e3e8ea;--card:rgba(255,255,255,.96);--accent:#1f6f8b;--good:#2e8b57;--warn:#d98a1b;--bad:#c2362f;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef2f3}
#map{position:absolute;inset:0}
.panel{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(20,40,50,.08)}
.title{left:16px;top:16px;padding:10px 14px}
.title h1{font-size:15px;font-weight:650;margin:0}.title p{font-size:12px;color:var(--mute);margin:2px 0 0}
.toggles{right:16px;top:16px;padding:6px;display:flex;gap:6px}
.tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:500 13px inherit;font-family:inherit;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px}
.tg i{width:10px;height:10px;border-radius:50%;background:#cfd8dc}
.tg[aria-pressed=true]{color:var(--ink);border-color:#c9d3d6}
.tg[aria-pressed=true].ec i{background:linear-gradient(90deg,#3aa76d,#f2b134,#e4572e)}
.tg[aria-pressed=true].am i{background:linear-gradient(90deg,#3aa76d,#9b7ad0,#5b2a86)}
.time{left:50%;transform:translateX(-50%);bottom:18px;width:min(760px,calc(100% - 32px));padding:12px 16px 10px}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.date{font-size:16px;font-weight:650;display:inline-block;min-width:150px;text-align:center}
.step{border:0;background:none;font-size:20px;line-height:1;color:var(--mute);cursor:pointer;padding:0 6px;vertical-align:-1px}.step:hover{color:var(--ink)}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:2px}
.tag.past{background:#eef2f3;color:var(--mute)}.tag.fc{background:#e3f1f6;color:var(--accent)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mute);flex-wrap:wrap;justify-content:flex-end}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #cfd8dc}
.legend .ramp{display:inline-block;width:64px;height:6px;border-radius:3px;vertical-align:1px;margin:0 5px}
#day{width:100%;margin:10px 0 2px;accent-color:var(--accent);cursor:pointer}
.ticks{position:relative;height:14px;font-size:10.5px;color:var(--mute)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span.l{transform:none}.ticks span.r{transform:translateX(-100%)}
.ticks span.today{color:var(--accent);font-weight:600}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(20,40,50,.14);padding:10px 12px;font-size:12.5px;min-width:220px;display:none;z-index:5}
.tip h3{font-size:13px;margin:0 0 6px;font-weight:650}
.tip .row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-top:5px}
.tip .v{font-variant-numeric:tabular-nums;font-weight:600}
.tip .chip{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.good{background:#e6f4ec;color:var(--good)}.chip.warn{background:#fbf0de;color:#a86509}.chip.bad{background:#fbe6e4;color:var(--bad)}
.tip .note{color:var(--mute);font-size:11px;margin-top:7px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px;pointer-events:none}
.attrib{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--mute);background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px}
.attrib a{color:inherit}
[hidden]{display:none!important}
@media(max-width:640px){.title p{display:none}.toggles{top:auto;bottom:128px;right:16px}.legend{display:none}}
</style></head>
<body>
<div id="map" aria-label="Map of rivers around Oxford"></div>
<div class="loading" id="loading">Loading…</div>
<div class="panel title"><h1>Oxford rivers</h1><p>Safe to swim? Safe for fish? Hover over a river.</p></div>
<div class="panel toggles" role="group" aria-label="Heatmaps">
  <button class="tg ec" id="tg-e" aria-pressed="true"><i></i>E. coli</button>
  <button class="tg am" id="tg-a" aria-pressed="false"><i></i>Ammonia</button>
</div>
<div class="panel time">
  <div class="trow"><div><button class="step" id="prev" aria-label="Previous day">‹</button><span class="date" id="date">–</span><button class="step" id="next" aria-label="Next day">›</button><span class="tag" id="tag"></span></div>
    <div class="legend" id="legend"></div></div>
  <input id="day" type="range" min="0" max="0" value="0" aria-label="Day">
  <div class="ticks" id="ticks"></div>
</div>
<div class="tip" id="tip"></div>
<div class="attrib">Estimates from a physics model of each works, not measurements · Basemap © Esri, HERE, Garmin, © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Rivers: OS Open Rivers, © Crown copyright</div>

<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
<script>
(async function(){
'use strict';
const Q=await fetch('data/quality.json').then(r=>r.json());
const P=Q.params, N=Q.seg.xy.length, D=Q.dates, NOBS=Q.nobs, $=id=>document.getElementById(id);
const MAIN=new Set(['River Thames','River Cherwell','River Evenlode','River Windrush','River Thame','River Ock','River Ray','River Glyme']);
let day=Math.min(NOBS,D.length-1), showE=true, showA=false;   // opens on today (the first forecast day)

// ---- concentrations for one day: background + every spilling works upstream, diluted and decaying with travel time ----
const E=new Float64Array(N), A=new Float64Array(N), FLOW=new Float64Array(N);
function compute(d){
  for(let j=0;j<N;j++){ const r=Q.seg.ref[j]; FLOW[j]=Math.max(r>=0?Q.flow[r][d]:Q.qspec[d]*Q.seg.area[j],P.min_flow); }
  E.fill(P.ecoli_bg); A.fill(P.ammonia_bg);
  const mo=+D[d].slice(5,7), ke=mo>=4&&mo<=9?P.ecoli_k_summer:P.ecoli_k_winter;   // E. coli dies off faster in summer light
  for(const w of Q.works){ if(!w.seg||!w.spill[d]) continue;
    for(let i=0;i<w.seg.length;i++){ const j=w.seg[i], t=w.t[i]/24, f=w.rate/(FLOW[j]+w.rate);
      E[j]+=P.ecoli_source*f*Math.exp(-ke*t); A[j]+=P.ammonia_source*f*Math.exp(-P.ammonia_k*t); } }
}
const verdictE=v=>v<=P.swim_ok?['good','Safe for swimmers']:v<=P.swim_bad?['warn','Take care if swimming']:['bad','Not safe to swim'];
const verdictA=v=>v<=P.fish_ok?['good','Safe for fish']:v<=P.fish_bad?['warn','Stressful for sensitive fish']:['bad','Harmful to fish'];
const fmtE=v=>v>=1e5?(v/1e3).toFixed(0)+',000':Math.round(v).toLocaleString('en-GB');
const fmtA=v=>v<1?v.toFixed(2):v<10?v.toFixed(1):Math.round(v).toString();

// ---- map (deck.gl: light basemap tiles, rivers, heatmaps, discharge points) ----
const {Deck,MapView,TileLayer,BitmapLayer,PathLayer,ScatterplotLayer,PathStyleExtension}=deck;
const tiles=(id,svc)=>new TileLayer({id,data:`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${svc}/MapServer/tile/{z}/{y}/{x}`,
  minZoom:0,maxZoom:16,tileSize:256,renderSubLayers:p=>{const {west,south,east,north}=p.tile.bbox;
    return new BitmapLayer(p,{data:null,image:p.data,bounds:[west,south,east,north]});}});
const SEG=Q.seg.xy.map((c,j)=>({j,path:[[c[0],c[1]],[c[2],c[3]]],m:MAIN.has(Q.names[Q.seg.name[j]])}));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function ramp(stops,v){ // stops: [[value, '#hex'],...] on log10(value)
  const x=Math.log10(Math.max(v,1e-6));
  for(let i=1;i<stops.length;i++){ const [v0,c0]=stops[i-1],[v1,c1]=stops[i], a=Math.log10(v0), b=Math.log10(v1);
    if(x<=b){ const t=Math.max(0,(x-a)/(b-a)), A=hex(c0), B=hex(c1); return A.map((u,k)=>Math.round(u+(B[k]-u)*t)); } }
  return hex(stops.at(-1)[1]); }
// green where safe; E. coli turns amber then red above the swimming limits, ammonia purple above the fish limits
const ES=[[P.swim_ok,'#3aa76d'],[P.swim_bad,'#f2b134'],[1e4,'#e4572e'],[3e5,'#8e1b3a']];
const AS=[[P.fish_ok,'#3aa76d'],[P.fish_bad,'#9b7ad0'],[3,'#5b2a86'],[10,'#2d0f4a']];
let SEGS=SEG, version=0, hover=null;
function layers(){
  const v=version;
  return [
    tiles('base','World_Light_Gray_Base'),
    new PathLayer({id:'river',data:SEG,getPath:d=>d.path,getColor:[143,191,214],widthUnits:'pixels',getWidth:d=>d.m?2.2:1,capRounded:true}),
    // every river is coloured: green where safe; the polluted stretches drawn on top so they stand out
    new PathLayer({id:'ecoli',data:SEGS,visible:showE,getPath:d=>d.path,getColor:d=>[...ramp(ES,E[d.j]),235],
      widthUnits:'pixels',getWidth:d=>(d.m?3.5:1.8)*(showA?1.6:1),capRounded:true,updateTriggers:{getColor:v,getWidth:showA}}),
    new PathLayer({id:'ammonia',data:SEGS,visible:showA,getPath:d=>d.path,getColor:d=>[...ramp(AS,A[d.j]),235],
      widthUnits:'pixels',getWidth:d=>(d.m?3.5:1.8)*(showE?0.55:1),capRounded:true,updateTriggers:{getColor:v,getWidth:showE}}),
    new PathLayer({id:'hit',data:SEG,getPath:d=>d.path,getColor:[0,0,0,1],widthUnits:'pixels',getWidth:14,pickable:true}),
    tiles('labels','World_Light_Gray_Reference'),
    // dotted connector from each discharge point to where it enters its river
    new PathLayer({id:'links',data:Q.works,getPath:w=>[[w.lon,w.lat],w.entry],getColor:[38,50,56,190],widthUnits:'pixels',getWidth:1.6,
      getDashArray:[2,2],dashJustified:true,extensions:[new PathStyleExtension({dash:true})]}),
    // halo on works spilling that day
    new ScatterplotLayer({id:'halo',data:Q.works.filter(w=>w.seg&&w.spill[day]),getPosition:w=>[w.lon,w.lat],radiusUnits:'pixels',getRadius:13,
      getFillColor:[194,54,47,55],updateTriggers:{getPosition:v}}),
    new ScatterplotLayer({id:'pts',data:Q.works,getPosition:w=>[w.lon,w.lat],radiusUnits:'pixels',getRadius:w=>w.seg&&w.spill[day]?7.5:6.5,
      stroked:true,lineWidthUnits:'pixels',getLineWidth:2,getLineColor:[255,255,255],
      getFillColor:w=>!w.seg?[144,164,174]:w.spill[day]?[194,54,47]:[38,50,56],
      pickable:true,updateTriggers:{getFillColor:v,getRadius:v}})];
}
const D3=new Deck({parent:$('map'),views:new MapView({repeat:false}),initialViewState:{longitude:-1.27,latitude:51.73,zoom:10.3,maxZoom:16,minZoom:8},
  controller:{dragRotate:false,touchRotate:false},layers:[],onHover:onHover,getCursor:({isHovering})=>isHovering?'crosshair':'grab'});

function render(){
  compute(day);
  const now=new Set();
  for(const w of Q.works) if(w.seg&&w.spill[day]) for(const j of w.seg) now.add(j);
  SEGS=[...SEG.filter(d=>!now.has(d.j)),...[...now].map(j=>SEG[j])]; version++;   // polluted stretches last = on top
  D3.setProps({layers:layers()});
  const fc=day>=NOBS;
  $('date').textContent=new Date(D[day]+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('tag').className='tag '+(fc?'fc':'past'); $('tag').textContent=fc?(day===NOBS?'Today · forecast':'Forecast'):'Past';
  $('legend').innerHTML=`<span><i class="dot" style="background:#c2362f"></i>spilling <i class="dot" style="background:#263238;margin-left:6px"></i>not spilling</span>`+(showE?`<span>E. coli<span class="ramp" style="background:linear-gradient(90deg,#3aa76d 0 30%,#f2b134 45%,#e4572e 70%,#8e1b3a)"></span>unsafe over ${P.swim_bad.toLocaleString('en-GB')}/100 mL</span>`:'')+
    (showA?`<span>Ammonia<span class="ramp" style="background:linear-gradient(90deg,#3aa76d 0 30%,#9b7ad0 45%,#5b2a86 75%,#2d0f4a)"></span>harmful over ${P.fish_bad} mg/L</span>`:'');
  if(hover) onHover(hover);
}

// ---- hover ----
const tip=$('tip');
function onHover(info){
  hover=info.object!=null?info:null;
  if(!hover){ tip.style.display='none'; return; }
  if(info.layer.id==='pts'){
    const w=info.object, fc=day>=NOBS; let s;
    if(!w.seg) s='No flow data: spills here are not estimated';
    else if(fc) s=`${Math.round(w.p[day]*100)}% chance of a spill${w.spill[day]?` · about ${Math.round(w.vol[day]).toLocaleString('en-GB')} m³`:''}`;
    else s=w.spill[day]?`Spilled${w.hours[day]?` for ${w.hours[day]} h`:''}${w.src[day]?' (model; no monitor record)':''}`:(w.src[day]?'No spill (model)':'No spill');
    tip.innerHTML=`<h3>${w.name}</h3><div>${s}</div><div class="note">Discharges into ${w.water||'a river'}</div>`;
  } else {
    const j=info.object.j, nm=Q.names[Q.seg.name[j]]||'Unnamed stream', [ce,te]=verdictE(E[j]), [ca,ta]=verdictA(A[j]);
    tip.innerHTML=`<h3>${nm}</h3>
      <div class="row"><span>E. coli</span><span class="v">${fmtE(E[j])} <small>per 100 mL</small></span></div><span class="chip ${ce}">${te}</span>
      <div class="row"><span>Ammonia</span><span class="v">${fmtA(A[j])} <small>mg/L</small></span></div><span class="chip ${ca}">${ta}</span>
      <div class="note">${day>=NOBS?'Forecast':'Estimate'} while any sewage spill upstream passes · river flow ${FLOW[j]<1?FLOW[j].toFixed(2):FLOW[j].toFixed(1)} m³/s</div>`;
  }
  tip.style.display='block';
  const pad=14, r=tip.getBoundingClientRect(); let x=info.x+pad, y=info.y+pad;
  if(x+r.width>innerWidth-8) x=info.x-r.width-pad; if(y+r.height>innerHeight-8) y=info.y-r.height-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
render(); $('loading').hidden=true;

// ---- controls ----
const sl=$('day'); sl.max=D.length-1; sl.value=day;
sl.style.background='none';
sl.oninput=()=>{ day=+sl.value; render(); };
const go=d=>{ day=Math.max(0,Math.min(D.length-1,d)); sl.value=day; render(); };
$('prev').onclick=()=>go(day-1); $('next').onclick=()=>go(day+1);
const tg=(id,get,set)=>{ $(id).onclick=()=>{ set(!get()); $(id).setAttribute('aria-pressed',String(get())); render(); }; };
tg('tg-e',()=>showE,v=>showE=v); tg('tg-a',()=>showA,v=>showA=v);
const pct=i=>(i/(D.length-1)*100).toFixed(2)+'%', mon=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{month:'short'});
let ticks=`<span class="l" style="left:0">${mon(D[0])} ${D[0].slice(0,4)}</span>`;
D.forEach((d,i)=>{ if(i>0&&d.slice(8)==='01'&&['01','04','07'].includes(d.slice(5,7))) ticks+=`<span style="left:${pct(i)}">${mon(d)}</span>`; });
if(NOBS<D.length) ticks+=`<span class="today r" style="left:100%">Today → ${D.length-NOBS} forecast days</span>`;
$('ticks').innerHTML=ticks;
})().catch(e=>{ document.getElementById('loading').textContent='Could not load: '+e.message; console.error(e); });
</script>
</body></html>
